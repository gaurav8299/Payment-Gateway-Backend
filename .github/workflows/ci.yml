name: Payment Gateway Backend CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: payment_gateway_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & Linting Checks
        run: |
          isort --profile black --check-only apps tests config
          black --check apps tests config
          flake8 apps config tests

      - name: Security Vulnerability Scan
        run: |
          bandit -r apps config -x tests --severity-level medium

      - name: Migration Consistency Check
        env:
          SECRET_KEY: test-secret-key-12345
          DEBUG: True
          DB_ENGINE: django.db.backends.sqlite3
          DB_NAME: ":memory:"
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run Unit & Integration Tests
        env:
          SECRET_KEY: test-secret-key-12345
          DEBUG: True
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: payment_gateway_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
          REDIS_CACHE_URL: redis://localhost:6379/1
          CELERY_BROKER_URL: amqp://guest:guest@localhost:5672//
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
        run: |
          pytest --cov=apps --cov-report=term-missing --cov-report=xml

      - name: Build Docker Image
        run: |
          docker build -t payment-gateway-backend:latest .
